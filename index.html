<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Reproductor</title>
  <style>
    body {
      max-width: 360px;
      margin: 48px auto;
      padding: 0 16px;
      font-family: system-ui, sans-serif;
      color: #222;
    }

    h1 { margin: 0; font-size: 24px; font-weight: 600; }
    p { margin: 4px 0 24px; font-size: 14px; color: #888; }
    input[type="range"] { width: 100%; accent-color: #222; }
    button { font: inherit; padding: 6px 12px; border: 1px solid #222; background: none; cursor: pointer; }
    button[aria-pressed="true"] { background: #222; color: #fff; }
    button:disabled { opacity: 0.3; cursor: default; }
    ol { padding-left: 20px; font-size: 14px; }
    li { padding: 4px 0; cursor: pointer; }
    .activa { font-weight: 600; }
  </style>
</head>
<body>
  <h1 id="titulo">Sin canción</h1>
  <p id="artista">Añade archivos de audio para empezar</p>

  <audio id="audio"></audio>

  <input id="progreso" type="range" min="0" max="100" value="0" step="0.1" aria-label="Progreso" disabled>
  <p><span id="tiempo-actual">0:00</span> / <span id="duracion">0:00</span></p>

  <p>
    <button id="btn-anterior" disabled>Anterior</button>
    <button id="btn-play" disabled>Reproducir</button>
    <button id="btn-siguiente" disabled>Siguiente</button>
    <button id="btn-repetir" aria-pressed="false" disabled>Repetir</button>
  </p>

  <p>Volumen</p>
  <input id="volumen" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen">

  <p><button id="btn-anadir">Añadir canciones</button></p>
  <input id="archivos" type="file" accept="audio/*" multiple hidden>

  <ol id="lista"></ol>

  <script src="renderer.js"></script>
</body>
</html>
